<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            color: #000069;
            margin-top: 20px;
            font-size: 36px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        form {
            margin: 0 auto;
            width: 80%;
            max-width: 900px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px auto;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #000069;
            color: white;
            text-transform: uppercase;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #f1f1f1;
        }

        input[type="number"] {
            width: 80px;
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input[type="checkbox"] {
            margin-right: 10px;
        }

        button {
            padding: 12px 20px;
            background-color: #000069;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #cf2e2e;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #000069;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #cf2e2e;
        }

        footer {
            margin-top: 50px;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>Order Page</h1>
    <h1>Order from {{ storename }}</h1>
    <p>User ID: {{ userid }}</p>

    <form method="POST">
        <h3>Menu</h3>
        {% if menulist %}
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody>
                {% for item in menulist %}
                    <tr>
                        <td>{{ item['item'] }}</td>
                        <td>£{{ item['price'] }}</td>
                        <td>
                            <input type="checkbox" name="order_items" value="{{ item['item'] }}">
                            <input type="number" name="quantity_{{ item['item'] }}" placeholder="Enter quantity">
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>No menu found.</p>
        {% endif %}
        
        <br>
        <button type="submit" name="action" value="add">Add to Order</button>
        <button type="submit" name="action" value="submit">Review Order</button>
    </form>

    <br>
    <a href="{{ url_for('homepage', enc_fname=encode_to_base64(fname), enc_userid=encode_to_base64(userid)) }}">Back to Homepage</a>

    <footer>
        <p>© 2024 Your Food Delivery Service</p>
    </footer>
</body>
</html>
